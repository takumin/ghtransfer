---
# https://taskfile.dev
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  default:
    desc: "{{.TASK}}"
    silent: true
    cmds:
      - task: aqua:all
      - task: pnpm

  aqua:
    internal: true
    label: aqua:install:{{.TAG}}
    dir: "{{.ROOT_DIR}}"
    sources:
      - .aqua/*.yaml
      - .aqua/*.json
      - .aqua/**/*.yaml
    generates:
      - .task/.done_aqua:install:{{.TAG}}
    cmds:
      - aqua install {{.ARGS}}
      - cmd: touch .task/.done_aqua:install:{{.TAG}}
        silent: true

  aqua:all:
    desc: "{{.TASK}}"
    cmds:
      - task: aqua
        vars:
          TAG: all
          ARGS: -a

  aqua:tag:*:
    desc: "{{.TASK}}"
    cmds:
      - task: aqua
        vars:
          TAG: "{{index .MATCH 0}}"
          ARGS: -t {{index .MATCH 0}}

  # Prunes the aqua root before CI saves it as a cache. A restore that falls
  # back to an older key carries that key's packages forward, so without this
  # every version bump would add to the cache for good.
  aqua:vacuum:
    desc: "{{.TASK}}"
    dir: "{{.ROOT_DIR}}"
    vars:
      REGISTRY_REF:
        sh: sed -n -E 's/^[[:space:]]*ref:[[:space:]]*([^[:space:]#]+).*/\1/p' .aqua/aqua.yaml
      AQUA_ROOT:
        sh: echo "${AQUA_ROOT_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/aquaproj-aqua}"
    cmds:
      # Running a package refreshes its last-used time, so what the job just ran
      # survives; versions idle for a week go.
      - aqua vacuum -d 7
      # vacuum does not track registries, and each registry bump adds a copy.
      - |-
        test -n '{{.REGISTRY_REF}}'
        registry='{{.AQUA_ROOT}}/registries/github_content/github.com/aquaproj/aqua-registry'
        if [ -d "$registry" ]; then
          find "$registry" -mindepth 1 -maxdepth 1 ! -name '{{.REGISTRY_REF}}' -exec rm -rf {} +
        fi

  # node and pnpm both come from aqua (the `node` tag), and the install is
  # skipped while the files that decide it are unchanged.
  pnpm:
    desc: Install node dependencies
    dir: "{{.ROOT_DIR}}"
    run: once
    deps:
      - task: aqua:tag:node
    sources:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
    generates:
      - node_modules/.modules.yaml
    cmds:
      - pnpm install --frozen-lockfile
